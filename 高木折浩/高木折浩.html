<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Book</title>

<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: sans-serif;
}

#book {
  position: relative;
  width: 90vw;
  max-width: 1000px;
  height: 90vh;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.controls {
  position: fixed;
  bottom: 20px;
  display: flex;
  gap: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #555;
}
</style>
</head>

<body>

<div id="book"></div>

<div class="controls">
  <!-- ✅ 關鍵：stopPropagation 防止翻兩頁 -->
  <button onclick="event.stopPropagation(); prevPage()">← Prev</button>
  <button onclick="event.stopPropagation(); nextPage()">Next →</button>
</div>

<script>
const TOTAL_PAGES = 29;
let current = 0;

const book = document.getElementById("book");
let pages = [];

// 建立頁面
for (let i = 1; i <= TOTAL_PAGES; i++) {
  const page = document.createElement("div");
  page.className = "page";

  const img = document.createElement("img");

  // ✅ 正確命名（補0）
  img.src = `pages/高木折浩_頁面_${String(i).padStart(2, "0")}_影像_0001.jpg`;

  page.appendChild(img);
  book.appendChild(page);
  pages.push(page);
}

// 更新顯示
function updatePages() {
  pages.forEach((page, i) => {
    page.style.display = (i === current) ? "block" : "none";
  });
}

// 下一頁
function nextPage() {
  if (current < TOTAL_PAGES - 1) {
    current++;
    updatePages();
  }
}

// 上一頁
function prevPage() {
  if (current > 0) {
    current--;
    updatePages();
  }
}

// 點擊畫面翻頁
document.addEventListener("click", (e) => {
  if (e.clientX > window.innerWidth / 2) {
    nextPage();
  } else {
    prevPage();
  }
});

// 鍵盤控制
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextPage();
  if (e.key === "ArrowLeft") prevPage();
});

// 手機滑動
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (endX - startX > 50) prevPage();
  if (startX - endX > 50) nextPage();
});

// 初始化
updatePages();
</script>

</body>
</html>
